name: PHP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mongodb, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - run: composer validate --strict
      - run: composer check
